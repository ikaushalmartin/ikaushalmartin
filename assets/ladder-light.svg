<svg xmlns="http://www.w3.org/2000/svg" width="900" height="204" viewBox="0 0 900 204" role="img" aria-label="Hardware range: 1 GB Raspberry Pi (make it fit), Jetson Nano (make it fast), Jetson Orin (max it out), AI accelerators (explore beyond).">
<title>Hardware range: 1 GB Raspberry Pi (make it fit), Jetson Nano (make it fast), Jetson Orin (max it out), AI accelerators (explore beyond).</title>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#e1e6eb"/></pattern>
<linearGradient id="lad" x1="130" y1="0" x2="770" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0d9488"/><stop offset=".35" stop-color="#2563eb"/><stop offset=".7" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
</defs>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}

@keyframes dash{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes halo{0%{r:0;opacity:.55}100%{r:16px;opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="899" height="203" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="32" y="44" class="mono" font-size="13" fill="#59636e">// how small i can go, and how far i can push</text>
<line x1="130" y1="98" x2="770" y2="98" stroke="#d0d7de" stroke-width="3" stroke-linecap="round"/>
<line x1="130" y1="98" x2="770" y2="98" stroke="url(#lad)" stroke-width="3" class="flow"/>
<circle cx="130" cy="98" r="17" fill="#0d9488" fill-opacity="0.16" style="animation:pulse 2.4s ease-in-out 0.0s infinite"/>
<circle cx="130" cy="98" r="8" fill="#0d9488"/>
<text x="130" y="150" class="sans" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">1 GB Raspberry Pi</text>
<text x="130" y="174" class="mono" font-size="12.5" fill="#0d9488" text-anchor="middle">make it fit</text>
<circle cx="343" cy="98" r="20" fill="#2563eb" fill-opacity="0.16" style="animation:pulse 2.4s ease-in-out 0.4s infinite"/>
<circle cx="343" cy="98" r="11" fill="#2563eb"/>
<text x="343" y="150" class="sans" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Jetson Nano</text>
<text x="343" y="174" class="mono" font-size="12.5" fill="#2563eb" text-anchor="middle">make it fast</text>
<circle cx="557" cy="98" r="23" fill="#7c3aed" fill-opacity="0.16" style="animation:pulse 2.4s ease-in-out 0.8s infinite"/>
<circle cx="557" cy="98" r="14" fill="#7c3aed"/>
<text x="557" y="150" class="sans" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Jetson Orin</text>
<text x="557" y="174" class="mono" font-size="12.5" fill="#7c3aed" text-anchor="middle">max it out</text>
<circle cx="770" cy="98" r="26" fill="#db2777" fill-opacity="0.16" style="animation:pulse 2.4s ease-in-out 1.2s infinite"/>
<circle cx="770" cy="98" r="17" fill="#f6f8fa" stroke="#db2777" stroke-width="2.5" stroke-dasharray="4 3.5"/>
<text x="770" y="150" class="sans" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">AI accelerators</text>
<text x="770" y="174" class="mono" font-size="12.5" fill="#db2777" text-anchor="middle">explore beyond</text>
</svg>
